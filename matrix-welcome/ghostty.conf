# Matrix wake-up splash for Ghostty
background = #000000
foreground = #00ff41
window-padding-x = 0
window-padding-y = 0
window-padding-color = extend-always
font-family = "JetBrainsMono Nerd Font"
font-size = 15
cursor-style = block
cursor-style-blink = false
confirm-close-surface = false
resize-overlay = never
window-theme = ghostty
